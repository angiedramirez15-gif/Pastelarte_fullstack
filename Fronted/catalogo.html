<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PastelArte - Catálogo</title>
  <link rel="stylesheet" href="ccs/style.css">
  <link rel="stylesheet" href="ccs/catalogo.css">
</head>

<body>
  <header class="header">

    <nav>
      <a href="index.html" class="logo-container">
        <img src="imagen/pastel-de-cumpleanos.png" alt="Logo PastelArte" class="logo-img">
        <span class="logo-text">PastelArte</span>
      </a>
      <div class="links">
        <a href="index.html" class="activo">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="personalizar.html">Personalizar</a>
        <a href="sobre.html">Sobre Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a id="linkGestion" style="display:none;">⚙️ Gestión</a>
        <a href="carrito.html" class="ver-carrito">🛒 Carrito</a>
        <div class="user-menu" id="userMenu" style="display:none;">
          <button id="btnUsuario">
            👤 <span id="nombreUsuario"></span> ▼
          </button>

          <div class="dropdown" id="menuUsuario">

            <a href="perfil.html">
              Mi perfil
            </a>

            <a href="#" id="cerrarSesion">
              Cerrar sesión
            </a>

          </div>
        </div>
        <a href="login.html" class="btn-login">Acceder</a>
      </div>
    </nav>
  </header>
  <!--Catálogo de productos--->
  <section class="catalogo">
    <h1>Nuestro Catalogo</h1>

    <p>Elige tu favorito y haz tu pedido en línea </p>

    <div class="productos">
      <a href="pasteles.html" class="item-catalogo">
        <div class="card">
          <img src="imagen/catalogo/PortadaPudines.jpg" alt="Pasteles">

          <h3>Pasteles</h3>
        </div>
      </a>
      <a href="postres.html" class="item-catalogo">
        <div class="card">
          <img src="imagen/catalogo/PortadaPostres.jpg" alt="Postres">

          <h3>Postres</h3>
        </div>
      </a>

      <a href="ceroazucar.html" class="item-catalogo">
        <div class="card">
          <img src="imagen/catalogo/PortadaCeroAzucar.jpg" alt="Cero Azucar">

          <h3>Cero Azucar</h3>
        </div>
      </a>

      <a href="adicionales.html" class="item-catalogo">
        <div class="card">
          <img src="imagen/Adicionales/Napoleon.jpg" alt="Adcionales">

          <h3>Adicionales</h3>
        </div>
      </a>
    </div>
  </section>

  <footer>
    <p>📍 Cali, Colombia | ☎️ 312 000 0000 | 💌 contacto@pastelarte.com</p>
  </footer>

  <script src="js/carrito.js"></script>
  <script>
    window.onload = function () {

     const nombre = localStorage.getItem("nombre");

     if(nombre){

         document.querySelector(".btn-login").style.display="none";

         document.getElementById("userMenu").style.display="block";

         document.getElementById("nombreUsuario").textContent=nombre;

     }

 }
    const boton=document.getElementById("btnUsuario");
const menu=document.getElementById("menuUsuario");

if(boton){

boton.addEventListener("click",function(){

menu.classList.toggle("mostrar");

});

window.addEventListener("click",function(e){

if(!boton.contains(e.target) && !menu.contains(e.target)){
menu.classList.remove("mostrar");
}

});

}

const salir=document.getElementById("cerrarSesion");

if(salir){

salir.addEventListener("click",function(){

localStorage.clear();

window.location.href="login.html";

});

}
  </script>
</body>

</html>
