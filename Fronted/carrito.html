<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - PastelArte</title>
  <link rel="stylesheet" href="ccs/style.css">
  <link rel="stylesheet" href="ccs/carrito.css">
</head>

<body>
  <header class="header">
    <nav>
      <a href="index.html" class="logo-container">
        <img src="imagen/pastel-de-cumpleanos.png" alt="Logo PastelArte" class="logo-img">
        <span class="logo-text">PastelArte</span>
      </a>
      <div class="links">
        <a href="index.html" class="activo">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="personalizar.html">Personalizar</a>
        <a href="sobre.html">Sobre Nosotros</a>
        <a href="contacto.html">Contacto</a>
        <a id="linkGestion" style="display:none;">⚙️ Gestión</a>
        <a href="carrito.html" class="ver-carrito">🛒 Carrito</a>
        <div class="user-menu" id="userMenu" style="display:none;">
          <button id="btnUsuario">
            👤 <span id="nombreUsuario"></span> ▼
          </button>

          <div class="dropdown" id="menuUsuario">

            <a href="perfil.html">
              Mi perfil
            </a>

            <a href="#" id="cerrarSesion">
              Cerrar sesión
            </a>

          </div>
        </div>
        <a href="login.html" class="btn-login">Acceder</a>
      </div>
    </nav>
  </header>

  <section class="carrito">
    <h1>🛒 Tu Carrito de Compras</h1>

    <div id="carrito-contenido"></div>

    <button id="vaciarCarrito" class="btn-vaciar">Vaciar carrito</button>


    <a href="pago.html" class="btn-pagar">Pagar ahora </a>

    <a href="catalogo.html" class="btn-volver">Seguir comprando</a>
  </section>

  <footer>
    <p>📍 Cali, Colombia | ☎️ 312 000 0000 | 💌 contacto@pastelarte.com</p>
  </footer>

  <script src="js/carrito.js"></script>
  <script>
    window.onload = function () {

     const nombre = localStorage.getItem("nombre");

     if(nombre){

         document.querySelector(".btn-login").style.display="none";

         document.getElementById("userMenu").style.display="block";

         document.getElementById("nombreUsuario").textContent=nombre;

     }

 }
    const boton=document.getElementById("btnUsuario");
const menu=document.getElementById("menuUsuario");

if(boton){

boton.addEventListener("click",function(){

menu.classList.toggle("mostrar");

});

window.addEventListener("click",function(e){

if(!boton.contains(e.target) && !menu.contains(e.target)){
menu.classList.remove("mostrar");
}

});

}

const salir=document.getElementById("cerrarSesion");

if(salir){

salir.addEventListener("click",function(){

localStorage.clear();

window.location.href="login.html";

});

}
  </script>
</body>

</html>
