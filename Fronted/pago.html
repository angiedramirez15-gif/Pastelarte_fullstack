<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PastelArte - Confirmar Pago</title>
  <link rel="stylesheet" href="ccs/style.css">
  <link rel="stylesheet" href="ccs/pago.css">
</head>

<body>

<header class="header">
  <nav>
    <a href="index.html" class="logo-container">
      <img src="imagen/pastel-de-cumpleanos.png" alt="Logo PastelArte" class="logo-img">
      <span class="logo-text">PastelArte</span>
    </a>
    <div class="links">
      <a href="index.html" class="activo">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="personalizar.html">Personalizar</a>
      <a href="sobre.html">Sobre Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <a href="admin.html">Administrador</a>
      <a href="carrito.html" class="ver-carrito">🛒 Carrito</a>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button id="btnUsuario">
          👤 <span id="nombreUsuario"></span> ▼
        </button>

        <div class="dropdown" id="menuUsuario">

          <a href="perfil.html">
            Mi perfil
          </a>

          <a href="#" id="cerrarSesion">
            Cerrar sesión
          </a>

        </div>
      </div>
      <a href="login.html" class="btn-login">Acceder</a>
    </div>
  </nav>
</header>

<section class="pago-page">

  <h1>💳 Confirmar pago</h1>

  <!-- FORMULARIO DE ENTREGA -->
  <form class="formulario" id="formEntrega">

    <b>📍 Dirección de entrega:</b>

    <label>Ciudad:</label>
    <input type="text" id="ciudad" placeholder="Ej: Cali" required>

    <label>Barrio:</label>
    <input type="text" id="barrio" placeholder="Ej: San Fernando" required>

    <label>Dirección exacta:</label>
    <input type="text" id="direccion" placeholder="Ej: Cra 12 #34-56" required>

    <label>Referencia (opcional):</label>
    <input type="text" id="referencia" placeholder="Ej: Casa color beige con reja negra">

    <label>Nombre de quien recibe:</label>
    <input type="text" id="receptor" placeholder="Ej: María Pérez" required>

    <label>Teléfono de contacto:</label>
    <input type="text" id="telefonoEntrega" placeholder="Ej: 3100000000" required>

    <b>Método de pago:</b>

    <div class="pago">
      <label>
        <input type="radio" id="pagoEfectivo" name="pago" value="efectivo" onclick="mostrarCampoNequi()">
        Efectivo (contra entrega)
      </label><br>

      <label>
        <input type="radio" id="pagoNequi" name="pago" value="nequi" onclick="mostrarCampoNequi()">
        Nequi 💜
      </label>
    </div>

    <div id="nequiCampo" style="display: none; margin-top: 15px;">
      <p>Transfiere tu pago a nuestro Nequi: <strong>312 000 0000</strong></p>

      <img width="20%" height="20%" src="imagen/nequi.png" alt="Pago con Nequi">

      <label>Número desde el que realizas el pago:</label>
      <input type="text" id="numeroNequi" placeholder="Ej: 3101234567">

      <label>Adjunta comprobante (obligatorio si pagas por Nequi):</label>
      <input type="file" id="comprobante" accept="image/*">
    </div>

  </form>

  <div id="resumen-pago"></div>

  <button class="btn-pagar" onclick="pagar()">Pagar ahora</button>

</section>

<footer>
  <p>📍 Cali, Colombia | ☎️ 312 000 0000 | 💌 contacto@pastelarte.com</p>
</footer>

<script>
  function mostrarCampoNequi() {
    const nequiCampo = document.getElementById("nequiCampo");
    const metodoNequi = document.getElementById("pagoNequi");
    nequiCampo.style.display = metodoNequi.checked ? "block" : "none";
  }

  document.addEventListener("DOMContentLoaded", () => {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let total = carrito.reduce((suma, item) => suma + item.precio, 0);

    document.getElementById("resumen-pago").innerHTML = `
      <h2>Total a pagar: <strong>$${total.toLocaleString()}</strong></h2>
      <p>Estás pagando los productos añadidos al carrito 🛒</p>
    `;
  });

  const API_PEDIDOS = "http://localhost:8080/pedidos";
  const API_DETALLES = "http://localhost:8080/detalle-pedidos";

  // Convierte el archivo del comprobante a una cadena base64 para guardarlo en la BD
  function leerArchivoComoBase64(archivo) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(archivo);
    });
  }

  async function pagar() {

    const clienteId = localStorage.getItem("clienteId");

    if (!clienteId) {
      alert("Debes iniciar sesión antes de pagar.");
      window.location.href = "login.html";
      return;
    }

    const carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    if (carrito.length === 0) {
      alert("Tu carrito está vacío.");
      return;
    }

    const ciudad = document.getElementById("ciudad").value.trim();
    const barrio = document.getElementById("barrio").value.trim();
    const direccion = document.getElementById("direccion").value.trim();
    const receptor = document.getElementById("receptor").value.trim();
    const telefono = document.getElementById("telefonoEntrega").value.trim();

    if (!ciudad || !barrio || !direccion || !receptor || !telefono) {
      alert("Por favor completa todos los campos obligatorios de dirección.");
      return;
    }

    const efectivo = document.getElementById("pagoEfectivo").checked;
    const nequi = document.getElementById("pagoNequi").checked;

    if (!efectivo && !nequi) {
      alert("Por favor selecciona un método de pago.");
      return;
    }

    let comprobanteBase64 = null;
    let numeroNequi = null;

    if (nequi) {
      const archivos = document.getElementById("comprobante").files;
      if (archivos.length === 0) {
        alert("Debes subir el comprobante de pago por Nequi.");
        return;
      }
      numeroNequi = document.getElementById("numeroNequi").value.trim();
      comprobanteBase64 = await leerArchivoComoBase64(archivos[0]);
    }

    const total = carrito.reduce((suma, item) => suma + item.precio, 0);

    // id_pago en la BD: 1 = nequi, 2 = efectivo (ver Data/pastelarte.sql)
    const idPago = nequi ? 1 : 2;

    // Estado automático según el método de pago
    const estado = nequi ? "pendiente_revision" : "pendiente_efectivo";

    const pedidoDTO = {
      idCliente: Number(clienteId),
      fecha: new Date().toISOString().split("T")[0], // YYYY-MM-DD
      estado: estado,
      total: total,
      idPago: idPago,
      comprobante: comprobanteBase64,
      numeroNequi: numeroNequi
    };

    try {

      // 1. Crear el pedido
      const respuestaPedido = await fetch(API_PEDIDOS, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pedidoDTO)
      });

      if (!respuestaPedido.ok) throw new Error("No se pudo crear el pedido");

      const pedidoCreado = await respuestaPedido.json();

      // 2. Crear un detalle_pedido por cada producto del carrito
      for (const item of carrito) {

        const detalleDTO = {
          idPedido: pedidoCreado.idPedido,
          idProducto: item.idProducto,
          idPersonalizacion: null,
          cantidad: 1,
          subtotal: item.precio
        };

        await fetch(API_DETALLES, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(detalleDTO)
        });
      }

      const mensaje = nequi
        ? "🎉 ¡Pedido registrado! Tu pago por Nequi está en revisión."
        : "🎉 ¡Pedido registrado! Pagarás en efectivo contra entrega.";

      alert(mensaje);

      localStorage.removeItem("carrito");
      window.location.href = "index.html";

    } catch (error) {
      console.error("Error al procesar el pedido:", error);
      alert("Ocurrió un error al registrar tu pedido. Intenta de nuevo.");
    }
  }
</script>

<script>
  window.onload = function () {

   const nombre = localStorage.getItem("nombre");

   if(nombre){

       document.querySelector(".btn-login").style.display="none";

       document.getElementById("userMenu").style.display="block";

       document.getElementById("nombreUsuario").textContent=nombre;

   }

}
  const boton=document.getElementById("btnUsuario");
const menu=document.getElementById("menuUsuario");

if(boton){

boton.addEventListener("click",function(){

menu.classList.toggle("mostrar");

});

window.addEventListener("click",function(e){

if(!boton.contains(e.target) && !menu.contains(e.target)){
menu.classList.remove("mostrar");
}

});

}

const salir=document.getElementById("cerrarSesion");

if(salir){

salir.addEventListener("click",function(){

localStorage.clear();

window.location.href="login.html";

});

}
</script>
</body>

</html>
